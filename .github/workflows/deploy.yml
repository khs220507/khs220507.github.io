name: Deploy Chirpy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: chirpy
          bundler: '2.6.9'
      - name: Build
        working-directory: chirpy
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Verify generated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('chirpy/_site')
          for page in ['index.html', 'about/index.html', 'cv/index.html', 'projects/index.html', 'posts/uart/index.html', 'tags/index.html']:
              text = (root / page).read_text()
              assert '김현수' in text, page
              assert 'Albert Einstein' not in text, page
              assert 'Chirpy' in text, page
          source_projects = list(Path('chirpy/_projects').glob('*.md'))
          assert len(list((root / 'projects').glob('*/index.html'))) == len(source_projects)
          import re
          source_posts = list(Path('chirpy/_posts').glob('*.md'))
          for source in source_posts:
              match = re.search(r'^permalink: (\S+)', source.read_text(), re.M)
              assert match, source
              assert (root / match[1].strip('/') / 'index.html').exists(), source
          assert len(list((root / 'posts').glob('*/index.html'))) == len(source_posts)
          print(f'Profile, CV, {len(source_projects)} projects, and {len(source_posts)} posts verified.')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chirpy/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
