<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img"><title>STM32 학습 경로</title><rect width="960" height="660" rx="20" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif" text-anchor="middle"><text x="480" y="50" font-size="28" font-weight="700" fill="#17243a">STM32 학습 경로</text><rect x="120" y="80" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="120" font-size="23" fill="#17243a">C · 포인터 · 자료구조</text><path d="M480 150v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="180" width="720" height="66" rx="12" fill="#fff3dd" stroke="#a3bbcf"/><text x="480" y="220" font-size="23" fill="#17243a">HAL · CMSIS · IRQ · Callback</text><path d="M480 250v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="280" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="320" font-size="23" fill="#17243a">GPIO → UART → DMA</text><path d="M480 350v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="380" width="720" height="66" rx="12" fill="#fff3dd" stroke="#a3bbcf"/><text x="480" y="420" font-size="23" fill="#17243a">ADC → Timer → PWM</text><path d="M480 450v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="480" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="520" font-size="23" fill="#17243a">I2C: 장치 주소 응답 검증 대기</text><text x="480" y="635" font-size="18" fill="#536779">학습 순서 개념도 · 실제 검증 상태는 본문 기준</text></g></svg>