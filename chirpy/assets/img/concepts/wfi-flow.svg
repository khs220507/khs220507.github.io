<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img"><title>WFI: 깨어난 뒤 완료 조건 재확인</title><rect width="960" height="660" rx="20" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif" text-anchor="middle"><text x="480" y="50" font-size="28" font-weight="700" fill="#17243a">WFI: 깨어난 뒤 완료 조건 재확인</text><rect x="120" y="80" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="120" font-size="23" fill="#17243a">UART DMA 송신 시작</text><path d="M480 150v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="180" width="720" height="66" rx="12" fill="#fff3dd" stroke="#a3bbcf"/><text x="480" y="220" font-size="23" fill="#17243a">완료 Flag가 0 → __WFI() 대기</text><path d="M480 250v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="280" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="320" font-size="23" fill="#17243a">Interrupt 발생 → CPU 실행 재개</text><path d="M480 350v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="380" width="720" height="66" rx="12" fill="#fff3dd" stroke="#a3bbcf"/><text x="480" y="420" font-size="23" fill="#17243a">완료 Callback에서 Flag 갱신</text><path d="M480 450v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="480" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="520" font-size="23" fill="#17243a">Flag 재확인: 미완료면 다시 대기</text><text x="480" y="635" font-size="18" fill="#536779">다른 Interrupt도 CPU를 깨울 수 있으므로 Flag 확인 필요</text></g></svg>