<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>HAL: 사용자 코드와 하드웨어의 연결</title><rect width="960" height="560" rx="20" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif" text-anchor="middle"><text x="480" y="50" font-size="28" font-weight="700" fill="#17243a">HAL: 사용자 코드와 하드웨어의 연결</text><rect x="120" y="80" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="120" font-size="23" fill="#17243a">사용자 코드 · Handle 설정</text><path d="M480 150v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="180" width="720" height="66" rx="12" fill="#fff3dd" stroke="#a3bbcf"/><text x="480" y="220" font-size="23" fill="#17243a">HAL 초기화 / 시작 함수</text><path d="M480 250v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="280" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="320" font-size="23" fill="#17243a">주변장치 레지스터 · 하드웨어 동작</text><path d="M480 350v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="380" width="720" height="66" rx="12" fill="#fff3dd" stroke="#a3bbcf"/><text x="480" y="420" font-size="23" fill="#17243a">IRQ Handler → HAL IRQ Handler → Callback</text><text x="480" y="535" font-size="18" fill="#536779">게시 글의 호출 관계를 요약한 자체 제작 개념도</text></g></svg>