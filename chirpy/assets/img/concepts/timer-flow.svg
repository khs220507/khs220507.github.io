<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img"><title>TIM2: 주기 생성과 작업 처리의 분리</title><rect width="960" height="660" rx="20" fill="#f5f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif" text-anchor="middle"><text x="480" y="50" font-size="28" font-weight="700" fill="#17243a">TIM2: 주기 생성과 작업 처리의 분리</text><rect x="120" y="80" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="120" font-size="23" fill="#17243a">84 MHz ÷ (8399 + 1) = 10 kHz</text><path d="M480 150v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="180" width="720" height="66" rx="12" fill="#fff3dd" stroke="#a3bbcf"/><text x="480" y="220" font-size="23" fill="#17243a">(4999 + 1) Tick → 500 ms Update Event</text><path d="M480 250v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="280" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="320" font-size="23" fill="#17243a">TIM2 IRQ → HAL Callback</text><path d="M480 350v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="380" width="720" height="66" rx="12" fill="#fff3dd" stroke="#a3bbcf"/><text x="480" y="420" font-size="23" fill="#17243a">Callback: 측정 요청 Flag = 1</text><path d="M480 450v20m-7-7 7 7 7-7" fill="none" stroke="#366388" stroke-width="3"/><rect x="120" y="480" width="720" height="66" rx="12" fill="#e3f0fc" stroke="#a3bbcf"/><text x="480" y="520" font-size="23" fill="#17243a">Main Loop: Flag 확인 → ADC · LED · UART</text><text x="480" y="635" font-size="18" fill="#536779">현재 글의 설정값과 처리 순서 요약</text></g></svg>