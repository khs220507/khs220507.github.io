<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>버튼 바운스와 50ms 디바운싱</title><rect x="0" y="0" width="720" height="620" rx="0" fill="#fbfcfe" stroke="none"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="36" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start">버튼 바운스와 50ms 디바운싱</text><text x="36" y="104" font-size="25" fill="#203047" font-weight="400" text-anchor="start">마지막 입력 변화부터 50ms 유지 확인</text><text x="36" y="163" font-size="25" fill="#203047" font-weight="400" text-anchor="start">원시 입력</text><path d="M40 245H170V190H192V245H217V190H248V245H275V190H665" fill="none" stroke="#b56135" stroke-width="4"/><path d="M275 170L275 440" stroke="#9aaabc" stroke-width="2" fill="none"/><path d="M555 170L555 440" stroke="#9aaabc" stroke-width="2" fill="none"/><path d="M275 288L555 288" stroke="#14766c" stroke-width="3" fill="none"/><text x="415" y="325" font-size="26" fill="#14766c" font-weight="600" text-anchor="middle">50ms 안정</text><text x="36" y="374" font-size="25" fill="#203047" font-weight="400" text-anchor="start">확정 입력</text><path d="M40 430H555V375H665" fill="none" stroke="#215db0" stroke-width="4"/><text x="36" y="495" font-size="25" fill="#203047" font-weight="400" text-anchor="start">바운스 중에는 확정 상태 유지</text><text x="36" y="544" font-size="25" fill="#203047" font-weight="400" text-anchor="start">안정된 눌림으로 바뀔 때 한 번만 처리</text></g></svg>