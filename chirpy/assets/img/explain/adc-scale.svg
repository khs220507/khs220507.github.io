<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>ADC 값과 전압의 대응</title><rect x="0" y="0" width="720" height="620" rx="0" fill="#fbfcfe" stroke="none"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="36" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start">ADC 값과 전압의 대응</text><text x="36" y="108" font-size="28" fill="#215db0" font-weight="600" text-anchor="start">입력 전압 → 12-bit 정수값</text><rect x="40" y="150" width="270" height="74" rx="10" fill="#edf3fa" stroke="none"/><text x="175" y="196" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">0V</text><text x="351" y="198" font-size="32" fill="#203047" font-weight="400" text-anchor="start">→</text><rect x="410" y="150" width="270" height="74" rx="10" fill="#dcefe7" stroke="none"/><text x="545" y="196" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">0</text><rect x="40" y="257" width="270" height="74" rx="10" fill="#edf3fa" stroke="none"/><text x="175" y="303" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">약 1.65V</text><text x="351" y="305" font-size="32" fill="#203047" font-weight="400" text-anchor="start">→</text><rect x="410" y="257" width="270" height="74" rx="10" fill="#dcefe7" stroke="none"/><text x="545" y="303" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">약 2048</text><rect x="40" y="364" width="270" height="74" rx="10" fill="#edf3fa" stroke="none"/><text x="175" y="410" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">약 3.3V</text><text x="351" y="412" font-size="32" fill="#203047" font-weight="400" text-anchor="start">→</text><rect x="410" y="364" width="270" height="74" rx="10" fill="#dcefe7" stroke="none"/><text x="545" y="410" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">4095</text><text x="36" y="514" font-size="24" fill="#203047" font-weight="400" text-anchor="start">계산 기준: VDDA를 3.3V로 가정</text><text x="36" y="558" font-size="25" fill="#ab562c" font-weight="600" text-anchor="start">이 CdS 모듈: 어두울수록 ADC 값 증가</text></g></svg>