<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>TCP 바이트와 응용 메시지의 경계</title><rect x="0" y="0" width="720" height="620" rx="0" fill="#fbfcfe" stroke="none"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="36" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start">TCP 바이트와 응용 메시지의 경계</text><text x="36" y="106" font-size="25" fill="#203047" font-weight="400" text-anchor="start">송신 앱의 메시지</text><rect x="40" y="126" width="640" height="70" rx="10" fill="#e7f0fa" stroke="none"/><text x="360" y="170" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">PING + CRLF</text><path d="M360 204L360 234" stroke="#4675aa" stroke-width="3" fill="none"/><path d="M353 226L360 234L367 226" fill="none" stroke="#4675aa" stroke-width="3"/><rect x="40" y="250" width="300" height="70" rx="10" fill="#fff0db" stroke="none"/><text x="190" y="294" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">recv 1: PI</text><rect x="380" y="250" width="300" height="70" rx="10" fill="#fff0db" stroke="none"/><text x="530" y="294" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">recv 2: NG + CRLF</text><path d="M360 328L360 364" stroke="#4675aa" stroke-width="3" fill="none"/><path d="M353 356L360 364L367 356" fill="none" stroke="#4675aa" stroke-width="3"/><rect x="40" y="380" width="640" height="70" rx="10" fill="#dcefe7" stroke="none"/><text x="360" y="424" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">수신 버퍼: PING + CRLF</text><text x="36" y="505" font-size="29" fill="#14766c" font-weight="600" text-anchor="start">줄바꿈 발견 → 메시지 하나 분리</text><text x="36" y="561" font-size="24" fill="#203047" font-weight="400" text-anchor="start">분할 위치는 호출마다 달라질 수 있음</text></g></svg>