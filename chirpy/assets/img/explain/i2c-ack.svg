<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>주소 바이트 뒤에 오는 ACK</title><rect x="0" y="0" width="720" height="620" rx="0" fill="#fbfcfe" stroke="none"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="36" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start">주소 바이트 뒤에 오는 ACK</text><text x="36" y="104" font-size="26" fill="#203047" font-weight="400" text-anchor="start">예시: 7-bit 주소 0x50에 쓰기</text><text x="36" y="152" font-size="23" fill="#215db0" font-weight="400" text-anchor="start">주소 7 bit</text><text x="495" y="152" font-size="23" fill="#ab562c" font-weight="400" text-anchor="start">R/W</text><text x="588" y="152" font-size="23" fill="#14766c" font-weight="400" text-anchor="start">응답</text><rect x="36" y="178" width="66" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="69" y="223" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">1</text><rect x="108" y="178" width="66" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="141" y="223" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">0</text><rect x="180" y="178" width="66" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="213" y="223" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">1</text><rect x="252" y="178" width="66" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="285" y="223" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">0</text><rect x="324" y="178" width="66" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="357" y="223" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">0</text><rect x="396" y="178" width="66" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="429" y="223" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">0</text><rect x="468" y="178" width="66" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="501" y="223" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">0</text><rect x="540" y="178" width="66" height="72" rx="10" fill="#fff0db" stroke="none"/><text x="573" y="223" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">0</text><rect x="612" y="178" width="66" height="72" rx="10" fill="#dcefe7" stroke="none"/><text x="645" y="223" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">0</text><text x="260" y="295" font-size="30" fill="#203047" font-weight="600" text-anchor="middle">0x50 &lt;&lt; 1 = 0xA0</text><text x="619" y="295" font-size="26" fill="#14766c" font-weight="600" text-anchor="middle">ACK</text><rect x="40" y="348" width="640" height="64" rx="10" fill="#edf3fa" stroke="none"/><text x="360" y="389" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">1~8번째 클록: 주소 + 쓰기 비트</text><rect x="40" y="436" width="640" height="64" rx="10" fill="#edf3fa" stroke="none"/><text x="360" y="477" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">9번째 클록: 수신 측 ACK(LOW)</text><text x="36" y="557" font-size="24" fill="#203047" font-weight="400" text-anchor="start">NACK: 9번째 클록에서 SDA가 HIGH</text></g></svg>