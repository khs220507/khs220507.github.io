<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img"><title>Interrupt와 Main Loop의 역할</title><rect x="0" y="0" width="720" height="670" rx="0" fill="#fbfcfe" stroke="none"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="36" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start">Interrupt와 Main Loop의 역할</text><rect x="40" y="90" width="640" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="360" y="135" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">TIM2: 500ms마다 Update Event</text><path d="M360 167L360 189" stroke="#4675aa" stroke-width="3" fill="none"/><path d="M353 181L360 189L367 181" fill="none" stroke="#4675aa" stroke-width="3"/><rect x="40" y="195" width="640" height="72" rx="10" fill="#fff0db" stroke="none"/><text x="360" y="240" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">IRQ / Callback: 요청 Flag 설정</text><path d="M360 272L360 294" stroke="#4675aa" stroke-width="3" fill="none"/><path d="M353 286L360 294L367 286" fill="none" stroke="#4675aa" stroke-width="3"/><rect x="40" y="300" width="640" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="360" y="345" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">Interrupt 종료 → Main Loop 복귀</text><path d="M360 377L360 399" stroke="#4675aa" stroke-width="3" fill="none"/><path d="M353 391L360 399L367 391" fill="none" stroke="#4675aa" stroke-width="3"/><rect x="40" y="405" width="640" height="72" rx="10" fill="#fff0db" stroke="none"/><text x="360" y="450" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">Main Loop: Flag 확인 · 초기화</text><path d="M360 482L360 504" stroke="#4675aa" stroke-width="3" fill="none"/><path d="M353 496L360 504L367 496" fill="none" stroke="#4675aa" stroke-width="3"/><rect x="40" y="510" width="640" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="360" y="555" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">ADC 측정 → LED 갱신 → UART 출력</text><text x="360" y="635" font-size="22" fill="#61738a" font-weight="400" text-anchor="middle">긴 작업은 Callback 바깥에서 실행</text></g></svg>