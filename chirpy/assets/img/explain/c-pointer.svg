<svg xmlns="http://www.w3.org/2000/svg" width="720" height="565" viewBox="0 0 720 565" role="img"><title>구조체 변수와 구조체 포인터</title><rect x="0" y="0" width="720" height="565" rx="0" fill="#fbfcfe" stroke="none"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="36" y="52" font-size="30" fill="#203047" font-weight="700" text-anchor="start">구조체 변수와 구조체 포인터</text><rect x="40" y="90" width="640" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="360" y="135" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">buffer: 실제 구조체 변수</text><path d="M360 167L360 189" stroke="#4675aa" stroke-width="3" fill="none"/><path d="M353 181L360 189L367 181" fill="none" stroke="#4675aa" stroke-width="3"/><rect x="40" y="195" width="640" height="72" rx="10" fill="#fff0db" stroke="none"/><text x="360" y="240" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">&amp;buffer: 구조체 변수의 주소</text><path d="M360 272L360 294" stroke="#4675aa" stroke-width="3" fill="none"/><path d="M353 286L360 294L367 286" fill="none" stroke="#4675aa" stroke-width="3"/><rect x="40" y="300" width="640" height="72" rx="10" fill="#e7f0fa" stroke="none"/><text x="360" y="345" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">ptr = &amp;buffer: 포인터에 주소 저장</text><path d="M360 377L360 399" stroke="#4675aa" stroke-width="3" fill="none"/><path d="M353 391L360 399L367 391" fill="none" stroke="#4675aa" stroke-width="3"/><rect x="40" y="405" width="640" height="72" rx="10" fill="#fff0db" stroke="none"/><text x="360" y="450" font-size="26" fill="#203047" font-weight="600" text-anchor="middle">ptr-&gt;length: 해당 구조체의 멤버 접근</text><text x="360" y="530" font-size="22" fill="#61738a" font-weight="400" text-anchor="middle">ptr-&gt;length 와 (*ptr).length 는 같은 멤버 접근</text></g></svg>